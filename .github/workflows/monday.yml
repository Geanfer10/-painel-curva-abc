name: Status do Monday
on:
  push:
    branches: [main]
    paths: ["dados/planilha.xlsx"]      # a planilha mudou (robô do PC) -> leva pro Monday na hora
  schedule:
    - cron: "*/10 10-23 * * 1-6"         # a cada 10 min, das 7h às 20h (Brasília), seg a sáb
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: monday
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Planilha -> Monday (etapas, itens novos e valores)
        if: github.event_name != 'schedule'
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: |
          pip install -q openpyxl
          python3 scripts/planilha_para_monday.py
      - name: Monday -> painel (status e orçamentos)
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python3 scripts/monday_sync.py
      - name: Enviar se mudou
        run: |
          git config user.name "robo-monday"
          git config user.email "robo-monday@users.noreply.github.com"
          git add dados/monday.json
          if git diff --cached --quiet; then echo "Nada a enviar."; exit 0; fi
          git commit -m "Atualiza status do Monday"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
