<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Ampliações DMP/DPA IV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Protótipo do novo painel: mesma identidade da apresentação (prancheta de engenharia escura).
   Estrutura: cabeçalho consolidado → seletor de obra → 4 etapas (Galpão, Armazenagem, Serviços preliminares, Investimento). */
:root{
  --ground:#d6e3d9; --panel:#ffffff; --panel-2:#d3e0d6; --rule:#b4c8b9;
  --grid:rgba(23,90,50,.07); --grid-2:rgba(23,90,50,.13);
  --band:#0f2e1c; --band-2:#17492c;
  --fg:#0d1a12; --muted:#435549; --faint:#66786c;
  --dmp:#145c32; --dpa:#145c32; --alert:#b4532a; --ink:#ffffff;
  --warn:#9a6510; --warn-bg:rgba(199,134,26,.12);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    linear-gradient(var(--grid-2) 1px,transparent 1px),linear-gradient(90deg,var(--grid-2) 1px,transparent 1px);
  background-size:24px 24px,24px 24px,120px 120px,120px 120px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,4vw,48px);padding-block:28px 64px;display:flex;flex-direction:column;gap:26px}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--c,var(--dmp));outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:800;text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,3.8vw,54px)}
h2{font-size:clamp(30px,3.6vw,48px)}
.proto.ok{color:var(--muted);border-color:var(--rule);border-style:solid}
.proto{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--warn);border:1px dashed var(--warn);border-radius:999px;padding:4px 10px}

/* ---------- cabeçalho ---------- */
.top{--fg:#f1f6f2;--muted:#a9c4b2;--c:#8fdcab;--panel:rgba(255,255,255,.08);--rule:rgba(255,255,255,.16);--warn:#e9c27a;
  background:linear-gradient(135deg,var(--band),var(--band-2));color:var(--fg);border-radius:14px;padding:clamp(20px,3vw,34px);
  box-shadow:0 18px 40px -24px rgba(19,49,31,.55);
  display:grid;grid-template-columns:minmax(0,1fr);gap:24px 40px;align-items:end;border-bottom:1px solid var(--rule);padding-bottom:24px}
.top .meta{display:flex;flex-direction:column;gap:12px}
.cons .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cons .v{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,4.4vw,60px);line-height:1;margin:6px 0 8px;white-space:nowrap}
.split{display:flex;height:12px;gap:2px;border-radius:2px;overflow:hidden}
.split i{display:block;height:100%}
.sleg{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.sleg b{font-weight:500;color:var(--fg)}

/* ---------- seletor de obra ---------- */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.obras{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:4px}
.obra{background:none;border:0;border-radius:5px;padding:8px 14px;font:500 13px var(--f-mono);color:var(--muted);cursor:pointer}
.obra[aria-pressed="true"]{background:rgba(255,255,255,.16);color:#ffffff}
.obra:hover{color:#ffffff}
.steps{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:0 6px}
.step[aria-selected="true"]{background:color-mix(in srgb,var(--c) 7%,transparent)}
.top .sub{margin:4px 0 0;color:var(--muted);font-size:16px}
.cons{text-align:right}
.top h1{color:var(--c)}

/* ---------- etapas ---------- */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-bottom:1px solid var(--rule)}
.step{background:none;border:0;border-bottom:3px solid transparent;padding:14px 8px 12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:baseline;color:var(--muted)}
.step b{font-family:var(--f-mono);font-weight:500;font-size:12.5px}
.step span{font-weight:600;font-size:15.5px}
.step[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--c)}
.step[aria-selected="true"] b{color:var(--c)}
.stage{position:relative;min-height:520px}
.pane{display:none}
.pane.on{display:block;animation:in .7s cubic-bezier(.2,.75,.15,1)}
@keyframes in{from{opacity:0;transform:translateX(24px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.pane [data-a]{animation:rise .7s cubic-bezier(.2,.75,.15,1) both;animation-delay:calc(var(--i,0) * 90ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:26px 0 20px}
.ph p{margin:8px 0 0;color:var(--muted);font-size:16px;max-width:60ch}
.nav{display:flex;gap:8px}
.nav button{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:8px 14px;font:500 13px var(--f-mono);cursor:pointer}
.nav button:hover{border-color:var(--c)}

/* galpão */
.g2{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:28px;align-items:center}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.spec{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;box-shadow:0 6px 16px -12px rgba(15,46,28,.45)}
.cat,.si,.big,.rack,.cv,.steps{box-shadow:0 6px 16px -12px rgba(15,46,28,.45)}
.step{color:var(--muted)}
.step span{color:var(--fg);opacity:.75}
.step[aria-selected="true"] span{opacity:1}
.cat .tr{background:#e3ece6}
.spec .v{color:var(--c)}
.spec .k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.spec .v{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,3vw,44px);line-height:1;margin-top:6px}
.spec .v small{font-size:.5em;color:var(--muted);font-weight:700;margin-left:4px}
.spec .d{font-size:13px;color:var(--muted);margin-top:4px}
.spec.wide{grid-column:1 / -1}
.cv{position:relative;aspect-ratio:1.35;border:1px solid var(--rule);border-radius:10px;background:radial-gradient(ellipse at 50% 60%,color-mix(in srgb,var(--c) 9%,transparent),transparent 65%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.cv .hint{position:absolute;left:14px;bottom:10px;font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.ob-hud{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-width:170px;pointer-events:none;box-shadow:0 6px 14px -10px rgba(15,46,28,.5)}
.ob-hud .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.ob-hud .v{font-family:var(--f-display);font-weight:800;font-size:21px;text-transform:uppercase;color:#145c32;line-height:1.05;margin-top:2px}
.ob-hud .bar{height:4px;background:#e3ece6;border-radius:2px;overflow:hidden;margin-top:6px}
.ob-hud .bar i{display:block;height:100%;width:0;background:#145c32}
.ob-ctl{position:absolute;right:10px;bottom:8px;display:flex;gap:6px}
.ob-ctl button{font:500 12px var(--f-mono);background:#fff;border:1px solid var(--rule);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--fg)}
.ob-ctl button:hover{border-color:#145c32}

/* armazenagem */
.rack{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px}
.rack svg{display:block;width:100%;height:auto}
.tbd{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:5px;padding:4px 8px;margin-top:8px}

/* serviços prévios */
.svc{display:flex;flex-direction:column;gap:12px}
.si{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:16px 20px}
.si .ix{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-mono);background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.si .t{font-weight:600;font-size:16.5px}
.si .d{font-size:13.5px;color:var(--muted);margin-top:3px}
.si .v{font-family:var(--f-mono);font-size:15.5px;text-align:right;white-space:nowrap}
.si .v small{display:block;font-size:11.5px;color:var(--muted)}
.sig{background:var(--panel);border:1px solid var(--rule);border-radius:8px}
.sig>.si{border:0;background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;grid-template-columns:auto minmax(0,1fr) auto auto}
.sig>.si:hover{background:color-mix(in srgb,var(--c) 6%,transparent)}
.sig>.si:focus-visible{outline:2px solid var(--c);outline-offset:-2px}
.sig .ch{font-size:22px;color:var(--muted);transition:transform .2s}
.sig[open-cat] .ch{transform:rotate(90deg)}
.sig[open-cat] .items{display:block}
.sig .items{padding:4px 20px 12px 70px}
.svtot{display:flex;justify-content:flex-end;gap:14px;align-items:baseline;font-family:var(--f-mono);color:var(--muted);margin-top:4px}
.svtot b{font-family:var(--f-display);font-size:30px;color:var(--fg)}

/* investimento */
.inv{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr);gap:28px;align-items:start}
.big{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:6px;position:sticky;top:16px}
.big .v{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,3vw,44px);line-height:1;color:var(--c);white-space:nowrap}
.big .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);padding-top:10px;border-top:1px solid var(--rule);margin-top:6px}
.big .row b{font-family:var(--f-mono);font-weight:500;color:var(--fg)}
.cats{display:flex;flex-direction:column;gap:6px}
.cat{background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.cat>button{width:100%;display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 150px 22px;gap:14px;align-items:center;background:none;border:0;padding:12px 16px;cursor:pointer;text-align:left}
.cat .cn{font-weight:600;font-size:14.5px}
.cat .cn small{display:block;font:400 11.5px var(--f-mono);color:var(--muted)}
.cat .tr{height:12px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.cat .tr i{display:block;height:100%;background:var(--c);transform-origin:left;animation:grow 1s cubic-bezier(.2,.75,.15,1) both;animation-delay:calc(var(--k) * 60ms + 250ms)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cat .cv2{font-family:var(--f-mono);font-size:14px;text-align:right;white-space:nowrap}
.cat .ch{color:var(--muted);transition:transform .2s;text-align:center}
.cat[open-cat] .ch{transform:rotate(90deg)}
.items{display:none;border-top:1px solid var(--rule);padding:6px 16px 12px}
.cat[open-cat] .items{display:block}
.it{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:12px;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:13.5px}
.it:last-child{border-bottom:0}
.it .iv{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.it.pend{color:var(--muted)}
.it.pend .iv{color:var(--warn)}
.it small{display:block;color:var(--muted);font-size:12px}
.note{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.pdfs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pdf{display:inline-flex;align-items:center;gap:4px;font:500 12px var(--f-mono);color:var(--c);text-decoration:none;border:1px solid var(--rule);background:var(--panel);border-radius:5px;padding:3px 8px}
.pdf:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--panel))}
.pdf:focus-visible{outline:2px solid var(--c);outline-offset:2px}
/* pareto */
:root{--cA:#145c32;--cB:#c7861a;--cC:#7a8a96}
.par{margin-top:28px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:22px 22px 14px;box-shadow:0 6px 16px -12px rgba(15,46,28,.45)}
.par-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.par h3{font-size:clamp(22px,2.2vw,30px);color:var(--c)}
.par-h p{margin:6px 0 0;color:var(--muted);font-size:14px}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:11px;height:11px;border-radius:2px;display:inline-block}
.lg i.ln{height:3px;width:16px;background:var(--fg)}
.pbox{overflow-x:auto}
#par{display:block}
#par text{font-family:var(--f-mono)}

@media (max-width:860px){
  .cons{text-align:left}
  .top,.g2,.inv,.obras{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cat>button{grid-template-columns:minmax(0,1fr) 120px 18px}
  .cat .tr{grid-column:1 / -1;grid-row:2}
  .si{grid-template-columns:auto minmax(0,1fr)}
  .si .v{grid-column:2;text-align:left}
  .sig .items{padding:4px 14px 12px}
  .big{position:static}
}
@media (prefers-reduced-motion:reduce){.pane.on,.pane [data-a],.cat .tr i{animation:none}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="meta">
      <div class="bar"><span class="proto" id="status">Carregando planilha…</span><nav class="obras" id="obras" aria-label="Obra"></nav></div>
      <p class="eyebrow">Goiás Verde · Engenharia · Luziânia</p>
      <h1 id="obraNome"></h1>
      <p class="sub" id="obraSub"></p>
    </div>
  </header>

  <div class="steps" role="tablist" id="steps" aria-label="Etapas"></div>
  <div class="stage" id="stage"></div>
</div>

<script>
/* ---------- Leitor de .xlsx embutido (sem bibliotecas externas) ----------
   Um .xlsx é um ZIP com arquivos XML. Lemos o ZIP, descompactamos com o
   DecompressionStream do navegador e interpretamos as planilhas. Fórmulas
   usam o último valor calculado salvo pelo Excel. */
async function unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), files={};
  let e=buf.byteLength-22;
  while(e>=0 && dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error("arquivo não é um .xlsx válido");
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true);
  const td=new TextDecoder();
  for(let i=0;i<n;i++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    const off=dv.getUint32(p+42,true), name=td.decode(u8.subarray(p+46,p+46+nl));
    files[name]={method,csize,off};
    p+=46+nl+xl+cl;
  }
  return async name=>{
    const f=files[name]; if(!f) return null;
    const ln=dv.getUint16(f.off+26,true), lx=dv.getUint16(f.off+28,true);
    const data=u8.subarray(f.off+30+ln+lx, f.off+30+ln+lx+f.csize);
    if(f.method===0) return td.decode(data);
    const s=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return await new Response(s).text();
  };
}
async function lerXlsx(buf){
  const get=await unzip(buf), xml=s=>new DOMParser().parseFromString(s,"application/xml");
  const tags=(d,t)=>[...d.getElementsByTagNameNS("*",t)];
  const ss=[]; const sst=await get("xl/sharedStrings.xml");
  if(sst) tags(xml(sst),"si").forEach(si=>ss.push(tags(si,"t").map(t=>t.textContent).join("")));
  const rels={}; tags(xml(await get("xl/_rels/workbook.xml.rels")),"Relationship").forEach(r=>rels[r.getAttribute("Id")]=r.getAttribute("Target"));
  const wb=xml(await get("xl/workbook.xml")), sheets=[];
  for(const s of tags(wb,"sheet")){
    const rid=s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id")||s.getAttribute("r:id");
    let tgt=rels[rid]||""; tgt=tgt.startsWith("/")?tgt.slice(1):"xl/"+tgt.replace(/^\.\//,"");
    const txt=await get(tgt); if(!txt) continue;
    const rows=[];
    tags(xml(txt),"row").forEach(row=>{
      const ri=+row.getAttribute("r")-1, arr=[];
      tags(row,"c").forEach(c=>{
        const ref=c.getAttribute("r"), t=c.getAttribute("t");
        let ci=0; for(const ch of ref.replace(/\d+/g,"")) ci=ci*26+(ch.charCodeAt(0)-64); ci--;
        const v=tags(c,"v")[0]?.textContent;
        let val=null;
        if(t==="s") val=ss[+v]; else if(t==="inlineStr") val=tags(c,"t").map(x=>x.textContent).join("");
        else if(t==="str"||t==="e") val=v??null; else if(t==="b") val=v==="1"; else if(v!=null&&v!=="") val=Number(v);
        arr[ci]=val;
      });
      rows[ri]=arr;
    });
    for(let i=0;i<rows.length;i++) if(!rows[i]) rows[i]=[];
    sheets.push({name:s.getAttribute("name"),rows});
  }
  let modified=null; const core=await get("docProps/core.xml");
  if(core){const m=tags(xml(core),"modified")[0]; if(m) modified=new Date(m.textContent);}
  return {sheets,modified};
}

const norm = s => String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim().toLowerCase();
const fmtDT = d => d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});

/* ---------- Leitura da planilha ---------- */
function num(v){
  if(typeof v==="number") return isFinite(v)?v:null;
  if(v==null) return null;
  const s=String(v).replace(/[R$\s]/g,"");
  if(!s) return null;
  const n=Number(s.includes(",")?s.replace(/\./g,"").replace(",","."):s);
  return isFinite(n)?n:null;
}
function parseSheet(rows){
  let h=-1, col={};
  for(let i=0;i<Math.min(rows.length,40);i++){
    const r=rows[i]||[], idx=k=>Array.from(r).findIndex(c=>norm(c)===k);
    const dk=["descricao","insumo ou servico","insumo/servico","servico"].find(k=>idx(k)>=0);
    if(dk && idx("preco total")>=0){
      h=i;
      col={item:idx("item"),local:idx("local"),desc:idx(dk),qtd:idx("quantidade"),un:idx("unidade"),
           pu:idx("preco unitario"),total:idx("preco total"),app:idx("aplicacao")};
      // observação: primeira coluna sem título à direita de "Aplicação" (ou com título Observação)
      col.orc=Array.from(r).findIndex(c=>/^orcamentos?( \(pdf\)| pdf)?$/.test(norm(c)));
      col.grp=Array.from(r).findIndex(c=>/^grupo/.test(norm(c)));
      col.obs=-1;
      if(col.app>=0) for(let j=col.app+1;j<=col.app+3;j++){ const h=r[j]; if(j!==col.orc && j!==col.grp && (h==null || /^observac/.test(norm(h)))){ col.obs=j; break; } }
      break;
    }
  }
  if(h<0) return null;
  const out=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[], g=k=>col[k]>=0?r[col[k]]:null;
    const desc=g("desc");
    if(desc==null || !String(desc).trim() || norm(desc)==="descricao" || norm(desc)==="insumo ou servico") continue;
    const ob=g("obs");
    out.push({
      item:g("item"), local:g("local")?String(g("local")).trim():"", desc:String(desc).trim(),
      qtd:num(g("qtd")), un:g("un")?String(g("un")).trim():"", pu:num(g("pu")), total:num(g("total"))||0,
      app:g("app")?String(g("app")).trim():"Não definida",
      obs:(ob!=null && typeof ob==="string")?ob.trim():"",
      orc:g("orc")!=null?String(g("orc")).trim():"",
      grp:g("grp")!=null?String(g("grp")).trim():""
    });
  }
  return out;
}
function assinatura(buf){ // FNV-1a do arquivo, para saber se mudou
  const b=new Uint8Array(buf); let h=0x811c9dc5;
  for(let i=0;i<b.length;i++){h^=b[i]; h=Math.imul(h,0x01000193);}
  return b.length+":"+(h>>>0).toString(16);
}
const ARQ="dados/planilha.xlsx", INTERVALO_MS=60000;
let DATA={}, SIG="";
function agrupar(itens){
  const g=new Map();
  itens.forEach(x=>{const k=x.app||"Não definida"; if(!g.has(k)) g.set(k,[]); g.get(k).push([x.desc,x.total,x.obs||"",x.orc||"",x.grp||""]);});
  return [...g.entries()].map(([k,its])=>[k,its.reduce((s,i)=>s+i[1],0),its]).sort((a,b)=>b[1]-a[1]);
}
async function carregar(){
  const st=document.getElementById("status");
  try{
    const res=await fetch(ARQ+"?t="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("não encontrei "+ARQ+" (HTTP "+res.status+")");
    const buf=await res.arrayBuffer(), sig=assinatura(buf);
    if(sig!==SIG){
      const wb=await lerXlsx(buf), d={};
      wb.sheets.forEach(s=>{const r=parseSheet(s.rows); if(r&&r.length) d[s.name]=agrupar(r);});
      const faltam=Object.values(OBRAS).filter(o=>!d[o.sheet]).map(o=>o.sheet);
      if(faltam.length) throw new Error("não achei a aba "+faltam.join(" e "));
      const primeira=!SIG; DATA=d; SIG=sig;
      st.dataset.mod=wb.modified?fmtDT(wb.modified):"—";
      cabecalho(); render(primeira);
    }
    st.className="proto ok"; st.textContent=`Planilha salva em ${st.dataset.mod} · conferida às ${new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`;
  }catch(e){ st.className="proto"; st.textContent="Não consegui ler a planilha: "+e.message+". Nova tentativa em 1 minuto."; }
}

/* 03 · Serviços preliminares (categoria "Serviço Preliminar" da planilha) */
function panePrev(k){
  const its=prelDe(k), usados=new Set(); let tot=0, pend=0;
  // 1º: coluna "Grupo" da planilha (itens com o mesmo texto viram um cartão)
  const porCol=new Map();
  its.filter(x=>x.grp).forEach(x=>{const n=norm(x.grp); if(!porCol.has(n)) porCol.set(n,{t:x.grp,m:[]}); porCol.get(n).m.push(x); usados.add(x);});
  const grupos=[...porCol.values()].map(g=>({t:g.t,d:(OBRAS[k].previos.find(p=>norm(p.t)===norm(g.t)||g.m.some(x=>p.itens.some(r=>r.test(x.d))))||{}).d||"",m:g.m}));
  // 2º: itens sem grupo na planilha caem nas palavras-chave do roteiro
  grupos.push(...OBRAS[k].previos.map(p=>{const m=its.filter(x=>!usados.has(x)&&p.itens.some(r=>r.test(x.d))); m.forEach(x=>usados.add(x)); return {t:p.t,d:p.d,m};}).filter(g=>g.m.length));
  its.filter(x=>!usados.has(x)).forEach(x=>grupos.push({t:x.d,d:x.o||"",m:[x]}));
  const rows=grupos.map((g,i)=>{
    const v=g.m.reduce((s,x)=>s+x.v,0), sem=g.m.filter(x=>!(x.v>0)).length; tot+=v; pend+=sem;
    const val=`<div class="v num">${v>0?brl(v):`<span class="tbd" style="margin:0">A orçar</span>`}<small>${g.m.length>1?`${g.m.length} itens na planilha`:""}</small></div>`;
    if(g.m.length>1){ // grupo com vários itens: clica para abrir a lista
      const lista=g.m.slice().sort((a,b)=>b.v-a.v).map(x=>`<div class="it ${x.v>0?"":"pend"}"><span>${esc(x.d)}${x.o?`<small>${esc(x.o)}</small>`:""}${x.orc?`<span class="pdfs">${orcLinks([x.orc])}</span>`:""}</span><span class="iv num">${x.v>0?brl(x.v):"sem preço"}</span></div>`).join("");
      return `<div class="sig" data-a style="--i:${i}"><button class="si" aria-expanded="false"><span class="ix">${i+1}</span><div><div class="t">${esc(g.t)}</div>${g.d?`<div class="d">${esc(g.d)}</div>`:""}</div>${val}<span class="ch">›</span></button><div class="items">${lista}</div></div>`;
    }
    const links=orcLinks(g.m.map(x=>x.orc));
    return `<div class="si" data-a style="--i:${i}"><span class="ix">${i+1}</span><div><div class="t">${esc(g.t)}</div>${g.d?`<div class="d">${esc(g.d)}</div>`:""}${links?`<div class="pdfs">${links}</div>`:""}</div>${val}</div>`;
  }).join("");
  return head(2,"O que precisa acontecer antes da obra começar. Valores à parte do investimento total.")+(rows?`<div class="svc">${rows}</div>
    <div class="svtot"><span>Total dos serviços preliminares${pend?` (${pend} sem preço)`:""}</span><b class="num">${brl(tot)}</b></div>`
    :`<p class="note">Nenhum item com a categoria "Serviço Preliminar" na planilha.</p>`);
}

/* ---------- orçamentos em PDF (SharePoint da empresa: abre só com login) ---------- */
const ORC_BASE="https://goiasverde.sharepoint.com/sites/PCMDigital/Documentos%20Compartilhados/Or%C3%A7amentos%20Amplia%C3%A7%C3%B5es/";
function orcURL(nome){
  nome=String(nome).trim(); if(/^https?:\/\//i.test(nome)) return nome;
  return ORC_BASE+nome.replace(/\\/g,"/").split("/").filter(Boolean).map(encodeURIComponent).join("/")+"?web=1";
}
function orcLinks(lista){
  const nomes=[...new Set(lista.flatMap(v=>String(v||"").split(/[;\n]/)).map(s=>s.trim()).filter(Boolean))];
  return nomes.map(n=>`<a class="pdf" href="${esc(orcURL(n))}" target="_blank" rel="noopener" title="Abrir ${esc(n)} no SharePoint (login da empresa)">📄 Ver orçamento</a>`).join("");
}

/* ---------- curva de Pareto por etapa ---------- */
function drawPar(k){
  const svg=document.getElementById("par"); if(!svg) return;
  const rows=cats(k).filter(c=>c[1]>0).map(c=>({n:c[0],v:c[1]})), tot=rows.reduce((s,r)=>s+r.v,0);
  if(!rows.length){svg.innerHTML="";return;}
  let acc=0; rows.forEach(r=>{acc+=r.v;r.s=r.v/tot;r.cum=acc/tot;r.cl=r.cum<=0.8+1e-9?"A":r.cum<=0.9+1e-9?"B":"C";});
  const n=rows.length, cw=svg.parentElement.clientWidth||900, W=Math.max(cw,n*52+120), H=420;
  const m={l:92,r:50,t:58,b:112}, iw=W-m.l-m.r, ih=H-m.t-m.b, step=iw/n, bw=Math.min(46,step*.62);
  const nice=v=>{const p=10**Math.floor(Math.log10(v)),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;};
  const ymax=nice(rows[0].v*1.12), y=v=>m.t+ih-v/ymax*ih, yp=v=>m.t+ih-v*ih, cx=i=>m.l+step*i+step/2;
  const col={A:"var(--cA)",B:"var(--cB)",C:"var(--cC)"}, tint={A:"rgba(20,92,50,.07)",B:"rgba(199,134,26,.10)",C:"rgba(122,138,150,.09)"};
  const ax=v=>v>=1e6?fmt(v/1e6,v%1e6?1:0)+" mi":fmt(v/1e3,0)+" mil";
  let s="";
  ["A","B","C"].forEach(c=>{const ix=rows.map((r,i)=>r.cl===c?i:-1).filter(i=>i>=0);if(!ix.length)return;
    const x0=m.l+step*ix[0],x1=m.l+step*(ix.at(-1)+1);
    s+=`<rect x="${x0}" y="${m.t-34}" width="${x1-x0}" height="${ih+34}" fill="${tint[c]}"/><rect x="${x0}" y="${m.t-34}" width="${x1-x0}" height="3" fill="${col[c]}"/>`;
    s+=`<text x="${(x0+x1)/2}" y="${m.t-18}" text-anchor="middle" font-size="12" font-weight="600" fill="${col[c]}">Classe ${c}</text>`;});
  for(let i=0;i<=4;i++){const v=ymax*i/4;s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${i?ax(v):"0"}</text>`;}
  [[.8,"80%"],[.9,"90%"]].forEach(([v,l])=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yp(v)}" y2="${yp(v)}" stroke="var(--fg)" stroke-dasharray="5 4" opacity=".45"/>`;});
  [0,.2,.4,.6,.8,.9,1].forEach(v=>s+=`<text x="${W-m.r+8}" y="${yp(v)+4}" font-size="11" fill="var(--muted)" font-weight="${v===.8||v===.9?600:400}">${Math.round(v*100)}%</text>`);
  rows.forEach((r,i)=>{const x=cx(i),top=y(r.v);
    s+=`<rect x="${x-bw/2}" y="${top}" width="${bw}" height="${Math.max(2,m.t+ih-top)}" rx="2" fill="${col[r.cl]}"><title>${esc(r.n)}: ${brl(r.v)} · ${fmt(r.s*100,1)}% · acumulado ${fmt(r.cum*100,1)}%</title></rect>`;
    const nm=r.n.length>20?r.n.slice(0,19)+"…":r.n;
    s+=`<text x="${x}" y="${m.t+ih+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${i+1}</text>`;
    s+=`<text transform="translate(${x+4},${m.t+ih+28}) rotate(-38)" text-anchor="end" font-size="11.5" fill="var(--fg)" font-family="IBM Plex Sans,sans-serif">${esc(nm)}<title>${esc(r.n)}</title></text>`;});
  const pts=rows.map((r,i)=>`${cx(i)},${yp(r.cum)}`).join(" ");
  s+=`<polyline points="${pts}" fill="none" stroke="var(--fg)" stroke-width="2.2" stroke-linejoin="round"/>`;
  rows.forEach((r,i)=>{s+=`<circle cx="${cx(i)}" cy="${yp(r.cum)}" r="4" fill="var(--panel)" stroke="var(--fg)" stroke-width="2"><title>Acumulado ${fmt(r.cum*100,1)}%</title></circle>`;});
  // rótulos das barras por cima da linha, com contorno claro para não embolar
  rows.forEach((r,i)=>{s+=`<text x="${cx(i)}" y="${y(r.v)-6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fg)" stroke="var(--panel)" stroke-width="4" paint-order="stroke" stroke-linejoin="round">${fmt(r.s*100,1)}%</text>`;});
  // % acumulado numa faixa própria no topo (não colide com as barras)
  rows.forEach((r,i)=>{s+=`<text x="${cx(i)}" y="${m.t-40}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${fmt(r.cum*100,1)}%</text>`;});
  s+=`<text x="${m.l-8}" y="${m.t-40}" text-anchor="end" font-size="10.5" fill="var(--muted)">acum.</text>`;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("width",W); svg.setAttribute("height",H); svg.innerHTML=s;
}
let __pr; addEventListener("resize",()=>{clearTimeout(__pr);__pr=setTimeout(()=>{if(state.e===3)drawPar(state.o);},150);});

/* ---------- galpão 3D se construindo (loop) ---------- */
let anim=null;
const ETAPAS_OBRA=[["Terreno",1.0],["Fundação",1.6],["Pilares",2.0],["Vigas e tesouras",2.0],["Cobertura",2.2],["Fechamento lateral",2.2],["Piso",1.4],["Galpão concluído",2.6]];
function startGalpao(o){
  const cv=document.getElementById("cvG"); if(!cv) return; const ctx=cv.getContext("2d");
  const g=o.galpao, L=g.L, W=g.W, H=g.H, R=Math.max(2.5,W*0.08);
  const T0=[];let acc=0;ETAPAS_OBRA.forEach(e=>{T0.push(acc);acc+=e[1];});const TOTAL=acc, NE=ETAPAS_OBRA.length-1;
  const COR={terra:"#d9c79f",terra2:"#c9b385",concreto:"#b9c2bd",bloco:"#9aa6a0",aco:"#147a3f",aco2:"#0f5f31",telha:"#b8c7cf",telha2:"#93a7b2",parede:"#eef2ef",parede2:"#dfe6e1",piso:"#c9d1cc",porta:"#7d8f84",cume:"#c7861a",cota:"#435549"};
  const st={yaw:-0.75,pitch:0.62,ty:-0.75,tp:0.62,drag:false,w:0,h:0};
  let t=RM?TOTAL-0.5:0, playing=!RM, last=performance.now();
  const fit=()=>{const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;if(!r.width)return;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);st.w=r.width;st.h=r.height;}; fit();
  // projeção isométrica (sem perspectiva): lados paralelos ficam do mesmo tamanho
  const rot=([x,y,z])=>{const cy=Math.cos(st.yaw),sy=Math.sin(st.yaw),cp=Math.cos(st.pitch),sp=Math.sin(st.pitch);const x1=x*cy-z*sy,z1=x*sy+z*cy;return [x1,y*cp-z1*sp,y*sp+z1*cp];};
  const P=p=>{const [x,y,z]=rot(p),diag=Math.hypot(L,W)+14,k=Math.min(st.w*0.95/diag, st.h*0.88/(diag*0.62+H+6));return [st.w/2+x*k, st.h*0.58-y*k, z];};
  const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
  const prog=i=>ease((t-T0[i])/ETAPAS_OBRA[i][1]);
  const stg=(p,i,n,sp=0.6)=>ease((p-i/n*sp)/(1-sp));
  let shapes=[];
  const poly=(pts,fill,stroke,alpha=1,lw=1,zf)=>{const s=pts.map(P);shapes.push({k:"p",s,z:zf??s.reduce((a,b)=>a+b[2],0)/s.length,fill,stroke,alpha,lw});};
  const line=(a,b,color,lw=2,alpha=1)=>{const s=[P(a),P(b)];shapes.push({k:"l",s,z:(s[0][2]+s[1][2])/2,color,lw,alpha});};
  const box=(xa,xb,ya,yb,za,zb,top,side)=>{const v=[[xa,ya,za],[xb,ya,za],[xb,ya,zb],[xa,ya,zb],[xa,yb,za],[xb,yb,za],[xb,yb,zb],[xa,yb,zb]];
    [[4,5,6,7,top],[0,1,5,4,side],[1,2,6,5,side],[2,3,7,6,side],[3,0,4,7,side]].forEach(f=>poly(f.slice(0,4).map(i=>v[i]),f[4],"rgba(0,0,0,.18)",1,.6));};
  const x0=-L/2, z0=-W/2, bay=L>60?7:5, cols=[]; for(let x=x0;x<=x0+L+0.01;x+=bay) cols.push(x);
  const roofY=z=>H+R*(1-Math.abs(z)/(W/2));
  function build(){
    shapes=[];
    const pT=prog(0), m=6+4*(1-pT);
    poly([[x0-m,-0.05,z0-m],[x0+L+m,-0.05,z0-m],[x0+L+m,-0.05,z0+W+m],[x0-m,-0.05,z0+W+m]],COR.terra,COR.terra2,pT,1,-1e9);
    const pF=prog(1);
    if(pF>0) cols.forEach((x,i)=>[z0,z0+W].forEach(z=>{const s=stg(pF,i,cols.length);if(s>0)box(x-0.9,x+0.9,0,0.9*s,z-0.9,z+0.9,COR.concreto,COR.bloco);}));
    const pP=prog(2);
    if(pP>0) cols.forEach((x,i)=>[z0,z0+W].forEach(z=>{const s=stg(pP,i,cols.length);if(s>0)box(x-0.3,x+0.3,0.9,0.9+(H-0.9)*s,z-0.3,z+0.3,COR.aco,COR.aco2);}));
    const pV=prog(3);
    if(pV>0){
      const xe=x0+L*Math.min(1,pV*1.4);
      line([x0,H,z0],[xe,H,z0],COR.aco,3); line([x0,H,z0+W],[xe,H,z0+W],COR.aco,3);
      cols.forEach((x,i)=>{const s=stg(pV,i,cols.length,0.5); if(s<=0) return;
        const zl=z0+(W/2)*s, zr=z0+W-(W/2)*s;
        line([x,H,z0],[x,roofY(zl),zl],COR.aco,2.4); line([x,H,z0+W],[x,roofY(zr),zr],COR.aco,2.4);
        if(s>0.6){ line([x,H,z0],[x,H,z0+W],COR.aco2,1.2,.7); for(let q=1;q<4;q++){const zq=z0+W*q/4; line([x,H,zq],[x,roofY(zq),zq],COR.aco2,1.1,.7);} }
      });
      if(pV>0.7) line([x0,H+R,0],[x0+L*ease((pV-0.7)/0.3),H+R,0],COR.cume,3.2);
    }
    const pC=prog(4);
    if(pC>0) for(let i=0;i<cols.length-1;i++){const s=stg(pC,i,cols.length-1,0.7); if(s<=0) continue;
      const xa=cols[i], xb=cols[i]+(cols[i+1]-cols[i])*s;
      poly([[xa,H,z0],[xb,H,z0],[xb,H+R,0],[xa,H+R,0]],COR.telha,COR.telha2,.95,.8);
      poly([[xa,H+R,0],[xb,H+R,0],[xb,H,z0+W],[xa,H,z0+W]],COR.telha2,COR.telha2,.95,.8);
    }
    const pW=prog(5);
    if(pW>0){
      for(let i=0;i<cols.length-1;i++){const s=stg(pW,i,cols.length-1,0.6); if(s<=0) continue; const y=H*s;
        poly([[cols[i],0,z0],[cols[i+1],0,z0],[cols[i+1],y,z0],[cols[i],y,z0]],COR.parede,COR.parede2,.9,.8);
        poly([[cols[i],0,z0+W],[cols[i+1],0,z0+W],[cols[i+1],y,z0+W],[cols[i],y,z0+W]],COR.parede,COR.parede2,.9,.8);}
      const s=ease((pW-0.4)/0.6);
      if(s>0) [x0,x0+L].forEach((x,j)=>{
        poly([[x,0,z0],[x,0,z0+W],[x,H*s,z0+W],[x,(H+R)*s,0],[x,H*s,z0]],COR.parede,COR.parede2,.9,.8);
        if(j===1&&s>0.9){const n=Math.max(2,Math.round(W/9));for(let d=0;d<n;d++){const zc=z0+W*(d+0.5)/n,hw=Math.min(2.4,W/n*0.32);
          poly([[x+0.05,0,zc-hw],[x+0.05,0,zc+hw],[x+0.05,5.5,zc+hw],[x+0.05,5.5,zc-hw]],COR.porta,COR.porta,.95);}}
      });
    }
    const pS=prog(6);
    if(pS>0) poly([[x0,0.03,z0],[x0+L*pS,0.03,z0],[x0+L*pS,0.03,z0+W],[x0,0.03,z0+W]],COR.piso,"#aab4ae",.95,.6,-1e8);
    const a=prog(7);
    if(a>0){
      line([x0,0,z0+W+4],[x0+L,0,z0+W+4],COR.cota,1.2,a); line([x0+L+4,0,z0],[x0+L+4,0,z0+W],COR.cota,1.2,a); line([x0-4,0,z0+W],[x0-4,H,z0+W],COR.cota,1.2,a);
      shapes.push({k:"t",p:P([0,0,z0+W+8]),txt:`${L} m`,alpha:a,z:1e9},{k:"t",p:P([x0+L+9,0,0]),txt:`${W} m`,alpha:a,z:1e9},{k:"t",p:P([x0-8,H/2,z0+W]),txt:`${H} m`,alpha:a,z:1e9});
    }
  }
  function draw(){
    ctx.clearRect(0,0,st.w,st.h);
    const G=Math.max(L,W)*0.85; ctx.globalAlpha=1; ctx.lineWidth=1; ctx.strokeStyle="rgba(23,90,50,.10)";
    for(let i=-G;i<=G;i+=5){let p=P([i,0,-G]),q=P([i,0,G]);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();p=P([-G,0,i]);q=P([G,0,i]);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();}
    shapes.sort((p,q)=>p.z-q.z);
    for(const s of shapes){
      ctx.globalAlpha=s.alpha;
      if(s.k==="p"){ctx.beginPath();s.s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=s.fill;ctx.fill();ctx.strokeStyle=s.stroke;ctx.lineWidth=s.lw;ctx.stroke();}
      else if(s.k==="l"){ctx.beginPath();ctx.moveTo(s.s[0][0],s.s[0][1]);ctx.lineTo(s.s[1][0],s.s[1][1]);ctx.strokeStyle=s.color;ctx.lineWidth=s.lw;ctx.lineCap="round";ctx.stroke();}
      else {ctx.font="500 12.5px 'IBM Plex Mono',monospace";ctx.textAlign="center";ctx.fillStyle=COR.cota;ctx.fillText(s.txt,s.p[0],s.p[1]);}
    }
    ctx.globalAlpha=1;
  }
  const ek=document.getElementById("obEk"), ev=document.getElementById("obEv"), eb=document.getElementById("obEb"), bt=document.getElementById("obPlay");
  const setPlay=v=>{playing=v; if(bt) bt.textContent=v?"⏸ Pausar":"▶ Continuar";}; setPlay(playing);
  if(bt) bt.onclick=()=>setPlay(!playing);
  const rs=document.getElementById("obRestart"); if(rs) rs.onclick=()=>{t=0;setPlay(true);};
  let lx,ly; cv.onpointerdown=e=>{st.drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(!st.drag)return;st.ty+=(e.clientX-lx)*0.008;st.tp=Math.max(0.12,Math.min(1.2,st.tp+(e.clientY-ly)*0.006));lx=e.clientX;ly=e.clientY;};
  cv.onpointerup=()=>st.drag=false;
  cancelAnimationFrame(anim);
  (function frame(now=performance.now()){
    if(!document.body.contains(cv)) return;
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(playing){ t+=dt; if(t>=TOTAL) t=0; if(!st.drag) st.ty+=dt*0.12; }
    st.yaw+=(st.ty-st.yaw)*0.12; st.pitch+=(st.tp-st.pitch)*0.12;
    if(!st.w) fit();
    build(); draw();
    let i=NE; for(let j=0;j<=NE;j++) if(t>=T0[j]) i=j;
    if(ev){ ev.textContent=ETAPAS_OBRA[i][0]; ek.textContent=i<NE?`Etapa ${i+1} de ${NE}`:"Obra concluída"; eb.style.width=`${Math.min(100,t/T0[NE]*100)}%`; }
    anim=requestAnimationFrame(frame);
  })();
  new ResizeObserver(fit).observe(cv);
}

carregar(); setInterval(carregar, INTERVALO_MS);
